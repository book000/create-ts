# Verifies that the Dockerfile of a generated project builds.

name: Template Docker build

on:
  push:
    branches:
      - main
      - master
    paths:
      - templates/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .node-version
      - .github/workflows/template-docker-build.yml
  pull_request:
    branches:
      - main
      - master
    paths:
      - templates/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .node-version
      - .github/workflows/template-docker-build.yml
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Generate project
        run: |
          node dist/index.mjs "$RUNNER_TEMP/docker-probe" \
            --name docker-probe --org book000 --repo docker-probe \
            --description probe --author book000 --license MIT --homepage "" \
            --bug-url https://github.com/book000/docker-probe/issues \
            --variant base --no-esm --no-test --docker \
            --no-ignore-data --no-add-reviewer --overwrite

      - name: Build generated Docker image
        run: docker build "$RUNNER_TEMP/docker-probe"
